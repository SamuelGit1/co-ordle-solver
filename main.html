<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
	<meta name="theme-color" content="#202020">
    <title>Wordle Solver – Fixed Case Sensitivity</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Co-ordle Solver</h1>
    </div>
    <div class="content">
        <div class="board-header">
            <span class="board-title">Guess rows</span>
            <div class="row-controls">
                <button id="addRowBtn" class="btn-icon">Add row</button>
                <button id="clearRowsBtn" class="btn-icon">Clear all</button>
            </div>
        </div>
        <div id="guessesContainer" class="guesses-container"></div>

        <div class="section-card">
            <div class="section-title" style="font-weight:700;">Dictionary (6‑letter word + frequency)</div>
            <textarea id="wordListInput" rows="5"></textarea>
            <div class="hint">Format: word (freq) per line, e.g. "adjoin (120)"</div>
        </div>

        <div class="section-card">
            <div class="section-title">Extra rules (optional)</div>
            <input type="text" id="extraDupConstraints" placeholder="s>=2, e<=1, o==0">
            <div class="hint">Advanced: force exact letter counts across the solution</div>
        </div>

        <button id="solveButton" class="solve-btn">SOLVE</button>
        <div id="resultsArea"></div>
        <footer>🟩 = correct position · 🟨 = in word, wrong position · ⬜ = not in word</footer>
    </div>
</div>

<script src="solver.js"></script>
</body>
</html>
